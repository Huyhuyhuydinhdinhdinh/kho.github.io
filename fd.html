<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập HTML CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Chuyển đến Nội dung chính</a>

    <header>
        <h1>Tiêu đề trang web</h1>
    </header>

    <nav>
        <img src="https://via.placeholder.com/150" alt="Logo mẫu">
        
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>

    <main id="main-content">
        
        <h2>Phần Lưới (Grid Class)</h2>
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/400" alt="Ảnh mẫu 1">
                <p>Nội dung cột 1</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400" alt="Ảnh mẫu 2">
                <p>Nội dung cột 2</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400" alt="Ảnh mẫu 3">
                <p>Nội dung cột 3</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400" alt="Ảnh mẫu 4">
                <p>Nội dung cột 4</p>
            </div>
        </div>

        <hr>

        <h2>Phần Flex (Flex Class)</h2>
        <div class="flex">
            <div class="flex-item">Mục 1</div>
            <div class="flex-item">Mục 2</div>
            <div class="flex-item">Mục 3</div>
        </div>

    </main>

    <footer>
        <p>&copy; 2024 Bài tập của tôi</p>
    </footer>

</body>
</html>
